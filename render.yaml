services:
  - type: web
    name: recourse-graphql-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8083
      - key: DATABASE_URL
        fromDatabase:
          name: recourse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: recourse-db
    databaseName: recourse_db
    user: recourse_user
    plan: free
    region: oregon
